[project]
name = "rl-car-racing"
version = "0.1.0"
description = "Pixel-based PPO for Gymnasium CarRacing with replay and local experiment tracking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium[box2d,other]>=1.2.1",
    "numpy>=2.3.3",
    "tensorboard>=2.20.0",
    "torch>=2.8.0",
    "tyro>=0.9.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.14.0",
    "black>=24.3.0",
    "isort>=5.12.0",
    "mypy>=1.7.0",
]

tracking = [
    "wandb>=0.22.2",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "isort>=7.0.0",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.0",
]

# Box2D invokes SWIG while building its extension in isolation.
[tool.uv.extra-build-dependencies]
box2d-py = ["swig==4.3.1"]
